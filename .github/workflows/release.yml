name: Build, check and publish Windows release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application and tests
        run: ./Build.ps1
      - name: Check parser, monitoring, navigation and tiles
        run: |
          $ErrorActionPreference='Stop'
          ./tests/EftPosition.Tests.exe (Join-Path $env:RUNNER_TEMP 'eft-core')
          if($LASTEXITCODE -ne 0){throw 'Core tests failed'}
          ./tests/AutoNavigationTests.exe ./assets
          if($LASTEXITCODE -ne 0){throw 'Navigation tests failed'}
          ./tests/TileMapTests.exe (Join-Path $env:RUNNER_TEMP 'eft-tiles')
          if($LASTEXITCODE -ne 0){throw 'Tile tests failed'}
      - name: Check screenshot cleanup, settings, floors and smooth view
        run: |
          $ErrorActionPreference='Stop'
          ./EftPosition.PolishTests.exe (Join-Path $env:RUNNER_TEMP 'eft-settings') (Join-Path $env:RUNNER_TEMP 'eft-ui-images')
          if($LASTEXITCODE -ne 0){throw 'Settings and cleanup tests failed'}
          ./EftPosition.SmoothViewTests.exe ./assets
          if($LASTEXITCODE -ne 0){throw 'Smooth view tests failed'}
      - name: Check languages and extract tooltips
        run: |
          $ErrorActionPreference='Stop'
          ./EftPosition.LanguageTests.exe (Join-Path $env:RUNNER_TEMP 'eft-language') (Join-Path $env:RUNNER_TEMP 'eft-language-images')
          if($LASTEXITCODE -ne 0){throw 'Language and extract tooltip tests failed'}
      - name: Check PNG viewport and tile rendering
        run: |
          $ErrorActionPreference='Stop'
          ./EftPosition.RasterTests.exe (Join-Path $env:RUNNER_TEMP 'eft-raster') (Join-Path $env:RUNNER_TEMP 'eft-raster-images')
          if($LASTEXITCODE -ne 0){throw 'Raster viewport tests failed'}
      - name: Check minimap, global shortcuts and automatic map selection
        run: |
          $ErrorActionPreference='Stop'
          ./EftPosition.OverlayTests.exe (Join-Path $env:RUNNER_TEMP 'eft-overlay') (Join-Path $env:RUNNER_TEMP 'eft-overlay-images')
          if($LASTEXITCODE -ne 0){throw 'Overlay tests failed'}
          ./EftPosition.MapDetectionTests.exe (Join-Path $env:RUNNER_TEMP 'eft-map-detection') (Join-Path $env:RUNNER_TEMP 'eft-map-detection-images')
          if($LASTEXITCODE -ne 0){throw 'Map detection tests failed'}
      - name: Package clean runtime and source archives
        run: ./tools/Package-Release.ps1
      - name: Publish version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content ./VERSION -Raw).Trim()
          gh release view $version --json tagName 2>$null
          if($LASTEXITCODE -eq 0){Write-Output "Release $version already exists; no files replaced.";exit 0}
          gh release create $version "artifacts/EFT-Position-Windows-$version.zip" "artifacts/EFT-Map-kod-zrodlowy-$version.zip" artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title "EFT Position $version" --notes-file RELEASE-NOTES.md --prerelease
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
